[project]
name = "ticketbot"
version = "4.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luke S", email = "web@webthedev.me" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "chat-exporter>=3.1.0",
    "discord>=2.3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
ticketbot = "ticketbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
